    factor: 60           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: caller_age
    value: -999            # the special number typed instead of a blank
    count: 38            # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: hour
    start_date: "2026-02-02"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-02-21"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: language
    true_levels: 3      # how many real categories there are after cleaning

